[project]
name = "ai-test-automation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mohamed_yasser", email = "my169294@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.19.1",
    "ast-decompiler>=0.8.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.3.17",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langsmith>=0.11.1",
    "libcst>=1.9.0",
    "openai>=3.3.1",
    "orjson>=3.12.0",
    "playwright>=1.62.0",
    "prometheus-client>=0.26.0",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "python-socketio>=5.16.4",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn>=0.52.4",
    "websockets>=16.1.1",
]

[project.scripts]
ai-test-automation = "ai_test_automation:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.4",
]
